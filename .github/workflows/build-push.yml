# =====================================================================
#  build-push -- uptime-kuma-hardened
#  Tout le pipeline vient du gabarit de jbsky/hardened-ci (lint, build,
#  tests sur le digest exact, arm64 natif, garde de revision, promotion
#  signee, SBOM attestee, README, purge, release, issue si echec).
#  Ce depot ne decrit que ce qui le distingue : .github/hardened-ci.json.
#  Le filtre paths: doit couvrir les entrees du compteur de revision : le
#  gabarit le verifie (hci-config.py --check).
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - 'init.go'
      - 'init_test.go'
      - 'go.mod'
      - 'keys/**'
      - 'scripts/**'
      - 'npm-overrides.json'
      # versions.json porte les build-args et le tag ; docker-compose.yml et
      # le Makefile portent le chemin de build local. Un fichier absent de
      # ce filtre est un fichier dont le changement n'est jamais construit.
      - 'versions.json'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'image.manifest'
      - '.hadolint.yaml'
      - '.github/hardened-ci.json'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: jbsky/hardened-ci/.github/workflows/build-push.yml@aec6950c16450b3af197516e433fb067c7036dd7 # v1.1.0
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
